# Lightweight compose — serves ONLY the landing page (mabnas.com) + Umami analytics.
# Use this when deploying the landing page before the full app stack.
# Once the full stack is live, stop this and use docker-compose.prod.yml instead.
#
# Usage:
#   docker compose -f docker-compose.landing.yml up -d
#
# Redeploy after editing landing/:
#   git pull && docker compose -f docker-compose.landing.yml restart caddy

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      LANDING_DOMAIN: ${LANDING_DOMAIN:-mabnas.com}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.landing:/etc/caddy/Caddyfile:ro
      - ./landing:/srv/landing:ro
      - landing_caddy_data:/data
      - landing_caddy_config:/config
    depends_on:
      - umami

  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD}
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 10s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: 1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      umami-db:
        condition: service_healthy

volumes:
  landing_caddy_data:
  landing_caddy_config:
  umami_db_data:
