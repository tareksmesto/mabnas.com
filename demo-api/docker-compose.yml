# Standalone demo-API stack: FastAPI + a dedicated Caddy for demo.mabnas.com.
# Run this on a host whose ports 80/443 are free (e.g. the landing OCI server,
# since the public site is on GitHub Pages). It is fully isolated from the main
# app stack — no shared network, DB, or secrets.
#
#   DEMO_DOMAIN=demo.mabnas.com ACME_EMAIL=info@mabnas.com \
#     docker compose up -d --build
#
# Redeploy after editing:
#   git pull && docker compose up -d --build

services:
  demo-api:
    build: .
    restart: unless-stopped
    expose:
      - "8100"
    # No published host port — only Caddy reaches it on the internal network.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      LANDING_DOMAIN: ${LANDING_DOMAIN:-mabnas.com}
      DEMO_DOMAIN: ${DEMO_DOMAIN:-demo.mabnas.com}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../:/srv/site:ro          # repo root = landing static files (index.html, images/, demo/)
      - demo_caddy_data:/data
      - demo_caddy_config:/config
    depends_on:
      - demo-api
      - umami

  # ── Analytics (Umami) — reuses the existing data volume from the old
  #    landing stack, so historical analytics + the admin login are preserved.
  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD}
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 10s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: 1
    depends_on:
      umami-db:
        condition: service_healthy

volumes:
  demo_caddy_data:
  demo_caddy_config:
  # The existing analytics data volume from the old landing stack.
  umami_db_data:
    external: true
    name: mabna-landing_umami_db_data
